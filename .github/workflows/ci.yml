name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run coverage
      - run: npm run build

  # The library runs on Node 20 even though the dev tooling needs 22+.
  runtime-node20:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: CJS smoke test
        run: |
          node -e "
            const p = require('./dist/index.cjs');
            const fs = require('fs');
            const g = new p.IapGuard({
              apple: { bundleId: 'com.example.app', rootCertificates: [fs.readFileSync('tests/fixtures/apple/certs/root.pem', 'utf8')] },
              store: new p.MemoryPurchaseStore(),
              clock: () => new Date('2026-11-18T12:00:00Z'),
            });
            const jws = JSON.parse(fs.readFileSync('tests/fixtures/apple/jws.json', 'utf8')).transactions.nonConsumable.jws;
            g.claim({ userId: 'u', platform: 'apple', signedTransaction: jws })
              .then((r) => { if (!r.isEntitled) process.exit(1); console.log('CJS ok'); });
          "
      - name: ESM smoke test
        run: |
          node --input-type=module -e "
            const p = await import('./dist/index.js');
            new p.IapGuard({ apple: { bundleId: 'x' } });
            console.log('ESM ok');
          "
